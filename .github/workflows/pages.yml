name: Deploy live demo (GitHub Pages)

# Builds the website with the trained models running in the visitor's browser
# (ONNX Runtime Web), tests it end-to-end in headless Chromium, then publishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export models, build and test the website
    runs-on: ubuntu-latest
    env:
      SITE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install export dependencies (CPU PyTorch + ONNX)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt onnx onnxruntime
      - name: Export trained models to ONNX (checked against PyTorch)
        run: python training/export_onnx.py --weights backend/weights --out frontend/public/model

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build website (in-browser inference)
        working-directory: frontend
        env:
          CI: false
          REACT_APP_INFERENCE: browser
          PUBLIC_URL: ${{ env.SITE_PATH }}
        run: |
          npm ci
          npm run build

      - name: End-to-end test in headless Chromium
        run: |
          mkdir -p "/tmp/site$SITE_PATH" && cp -r frontend/build/. "/tmp/site$SITE_PATH/"
          (cd /tmp/site && python -m http.server 8080 > /dev/null 2>&1 &)
          mkdir -p /tmp/e2e && cp frontend/e2e/smoke.js /tmp/e2e/ && cd /tmp/e2e
          npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node smoke.js "http://localhost:8080$SITE_PATH/" "$GITHUB_WORKSPACE/test_images/2.jpeg"
      - name: Save screenshot of the tested page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshot
          path: /tmp/e2e/screenshot.png
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
